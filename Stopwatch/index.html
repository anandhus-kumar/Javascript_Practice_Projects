<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stopwatch</title>
    <link rel="stylesheet" href="style.css" />
    <script
      src="https://kit.fontawesome.com/b13e7c7793.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div class="container">
      <div class="stopwatch">
        <p id="display">00:00:00</p>
        <div class="control">
          <div onclick="stopWatch()"><i class="fa-solid fa-stop"></i></div>
          <div onclick="startWatch()"><i class="fa-solid fa-play"></i></div>
          <div onclick="resetWatch()">
            <i class="fa-solid fa-arrow-rotate-left"></i>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>

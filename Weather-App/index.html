<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="card">
      <video class="bg-video" autoplay muted loop>
        <source src="" type="video/mp4" />
      </video>
      <div class="search">
        <input type="text" placeholder="Enter city name" spellcheck="false" />
        <button><img src="../Weather-App/images/search.png" alt="" /></button>
      </div>
      <div class="error">
        <p>Invalid City Name</p>
      </div>
      <div class="weather">
        <img src="images/rain.png" class="weather-icon" alt="" />
        <h1 class="temp">22°C</h1>
        <h2 class="city">kollam</h2>
        <div class="details">
          <div class="col">
            <img src="images/humidity.png" alt="" />
            <div>
              <p class="humidity">50%</p>
              <p>Humidity</p>
            </div>
          </div>
          <div class="col">
            <img src="images/wind.png" alt="" />
            <div>
              <p class="wind">15 km/h</p>
              <p>Wind Speed</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const apiKey = "Your API Key";
      const apiUrl =
        "https://api.openweathermap.org/data/2.5/weather?units=metric&q=";

      const searchBox = document.querySelector(".search input");
      const searchBtn = document.querySelector(".search button");
      const weatherIcon = document.querySelector(".weather-icon");
      const bgVideo = document.querySelector(".bg-video");

      async function checkWeather(city) {
        const response = await fetch(apiUrl + city + `&appid=${apiKey}`);
        if (response.status == 404) {
          document.querySelector(".error").style.display = "block";
          document.querySelector(".weather").style.display = "none";
        } else {
          var data = await response.json();
          console.log(data);

          document.querySelector(".city").innerHTML = data.name;
          document.querySelector(".humidity").innerHTML =
            data.main.humidity + "%";
          document.querySelector(".wind").innerHTML = data.wind.speed + "km/h";
          document.querySelector(".temp").innerHTML =
            Math.floor(data.main.temp) + "°C";

          if (data.weather[0].main == "Clouds") {
            weatherIcon.src = "images/clouds.png";
            bgVideo.style.display = "block";
            bgVideo.src = "assets/cloud.mp4";
            bgVideo.load();
          } else if (data.weather[0].main == "Clear") {
            weatherIcon.src = "images/clear.png";
            bgVideo.style.display = "block";
            bgVideo.src = "assets/clear.mp4";
            bgVideo.load();
          } else if (data.weather[0].main == "Rain") {
            weatherIcon.src = "images/rain.png";
            bgVideo.style.display = "block";
            bgVideo.src = "assets/rainy.mp4";
            bgVideo.load();
          } else if (data.weather[0].main == "Drizzle") {
            weatherIcon.src = "images/drizzle.png";
            bgVideo.style.display = "block";
            bgVideo.src = "assets/drizzle.mp4";
            bgVideo.load();
          } else if (data.weather[0].main == "Mist") {
            weatherIcon.src = "images/mist.png";
          } else if (data.weather[0].main == "Snow") {
            weatherIcon.src = "images/mist.png";
            bgVideo.style.display = "block";
            bgVideo.src = "assets/snow.mp4";
            bgVideo.load();
          }

          document.querySelector(".weather").style.display = "block";
          document.querySelector(".error").style.display = "none";
        }
      }

      searchBtn.addEventListener("click", () => {
        checkWeather(searchBox.value);
      });
    </script>
  </body>
</html>

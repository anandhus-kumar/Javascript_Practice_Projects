<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email subscription</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="hero">
      <h3>Coming soon!</h3>
      <h1>
        Our Brand New <br />
        Website is on It's way
      </h1>
      <p>Subscribe for more details.</p>
      <form name="submit-to-google">
        <input type="email" name="Email" placeholder="Your Email " required />
        <button type="submit">
          <img src="send-icon.png" width="30px" alt="" />
        </button>
      </form>
      <span id="msg"></span>
    </div>

    <script>
      
	const scriptURL = "YPUR SCRIPT"
	const form = document.forms['submit-to-google']
  let Success = document.getElementById("msg")

	form.addEventListener('submit', e => {
		e.preventDefault()
		fetch(scriptURL, { method: 'POST', body: new FormData(form) })
			.then(response => response.json())
			.then(response => {
        Success.innerHTML = "Thanks for subscribing"
        setTimeout(() => {
          Success.innerHTML="";
        },5000)
        form.reset();
      })
			.catch(error => console.error('Error!', error.message))

	})
</script>
    </script>
  </body>
</html>

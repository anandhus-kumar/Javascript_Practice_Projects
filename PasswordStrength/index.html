<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Strength</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="input-box">
        <input type="text" placeholder="Enter Password" id="password" />
        <button type="submit"><span> ➡️ </span></button>
        <p id="message">Password is <span id="span"></span></p>
      </div>
    </div>

    <script>
      var pass = document.getElementById("password");
      var message = document.getElementById("message");
      var span = document.getElementById("span");

      pass.addEventListener("input", () => {
        if (pass.value.length > 0) {
          message.style.display = "block";
        } else {
          message.style.display = "none";
        }
        if (pass.value.length < 4) {
          span.innerHTML = "Weak";
          span.classList.add("weak");
          pass.style.borderColor = "red";
        } else if (pass.value.length >= 4 && pass.value.length < 8) {
          span.innerHTML = "Medium";
          span.classList.add("medium");
          pass.style.borderColor = "orange";
        } else if (pass.value.length >= 8) {
          span.innerHTML = "Strong";
          span.classList.add("strong");
          pass.style.borderColor = "green";
        }
      });
    </script>
  </body>
</html>
